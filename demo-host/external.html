<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Externe testpagina (andere origin)</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#1a1a1a}
    main{max-width:720px;margin:32px auto;padding:0 16px}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
    .hostbtn{font:inherit;cursor:pointer;padding:.65em 1.1em;border-radius:6px;border:1px solid #333;background:#fff}
  </style>
</head>
<body>
  <main>
    <h1>Externe testpagina</h1>
    <p>Draait op een andere origin dan de app (poort 3200 versus 3100) om het widget zoals op een echte
      makelaarssite te testen. Tenant <code>rotsvast-test</code>, woning volledig via <code>data-*</code>.</p>
    <div class="actions">
      <button class="hostbtn" type="button">Contact</button>
      <button class="hostbtn" type="button" id="brochure-knop">Bekijk brochure</button>
    </div>

    <script src="http://localhost:3100/widget.js"
            data-tenant="rotsvast-test"
            data-property-id="TEST-12345"
            data-rent="1650"
            data-address="Voorbeeldlaan 12, Amsterdam"
            data-target="#brochure-knop"
            data-class="hostbtn"
            data-lang="auto" async></script>
  </main>
</body>
</html>
